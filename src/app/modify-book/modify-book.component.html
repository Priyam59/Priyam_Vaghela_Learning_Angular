<!-- modify-student.component.html
This is built using Reactive Forms-->
<form [formGroup]="bookForm" (ngSubmit)="onSubmit()">
  <!-- ID Field -->
  <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" />
  </div>

  <!--first Name Field -->
  <div class="form-group">
    <label for="title">Title</label>
    <input type="text" id="title" formControlName="title" />
  </div>

  <!--last name Field -->
  <div class="form-group">
    <label for="author">Author</label>
    <input type="text" id="author" formControlName="author" />
  </div>

  <!-- genre Field -->
  <div class="form-group">
    <label for="genre">Genre</label>
    <input type="text" id="genre" formControlName="genre" />
  </div>

  <!-- Is Admin Checkbox -->
  <div class="form-group">
    <label for="available">Is Admin</label>
    <input type="checkbox" id="available" formControlName="available" />
  </div>

  <!-- Submit Button (Add or Update) -->
  <button type="submit">Submit</button>

  <!-- Delete Button (Always Displayed Now) -->
  <button type="button" (click)="onDelete()">Delete</button>

  <!-- Back Button -->
  <button type="button" (click)="navigateToBookList()">Back to List</button>
</form>
<div *ngIf="error" class="error">{{ error }}</div>
